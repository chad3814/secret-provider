name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest

    strategy:
      # Report every version's result rather than cancelling siblings on the
      # first failure, so a Node 26 break does not mask a Node 22 break.
      fail-fast: false
      matrix:
        node: ['22', '24', '26']

    # 22 and 24 are LTS and gate the release; 26 is current, so a failure there
    # is early warning rather than something that blocks merging.
    continue-on-error: ${{ matrix.node == '26' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
